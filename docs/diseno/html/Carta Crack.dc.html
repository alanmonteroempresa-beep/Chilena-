<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<script src="./image-slot.js"></script>
</helmet>
<div style="width:260px;height:368px;position:relative;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45));font-family:'Barlow',sans-serif;">
  <div style="position:absolute;inset:0;clip-path:polygon(0 5%,8% 0,38% 0,43% 2.6%,57% 2.6%,62% 0,92% 0,100% 5%,100% 95%,92% 100%,8% 100%,0 95%);background:{{ rim }};"></div>
  <div style="position:absolute;inset:4px;clip-path:polygon(0 5%,8% 0,38% 0,43% 2.6%,57% 2.6%,62% 0,92% 0,100% 5%,100% 95%,92% 100%,8% 100%,0 95%);background:{{ bg }};overflow:hidden;color:{{ ink }};">
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px);pointer-events:none;"></div>

    <sc-if value="{{ isFront }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;right:6px;top:24px;width:176px;height:196px;">
        <image-slot id="{{ photoId }}" shape="rect" placeholder="Foto recortada" style="width:176px;height:196px;color:{{ ink }};"></image-slot>
        <div style="position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(0deg,{{ fade }},rgba(0,0,0,0));pointer-events:none;"></div>
      </div>
      <div style="position:absolute;left:18px;top:24px;display:flex;flex-direction:column;align-items:center;gap:6px;width:56px;">
        <sc-if value="{{ showMedia }}" hint-placeholder-val="{{ true }}">
          <span style="font-family:'Big Shoulders Display';font-weight:900;font-size:58px;line-height:.78;">{{ media }}</span>
        </sc-if>
        <sc-if value="{{ oculto }}" hint-placeholder-val="{{ false }}">
          <span style="width:52px;height:46px;border-radius:10px;border:2px dashed {{ ink }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;"><span style="font-family:'Material Symbols Rounded';font-size:26px;">lock</span></span>
        </sc-if>
        <span style="font-family:'Big Shoulders Display';font-weight:900;font-size:22px;line-height:1;">{{ pos }}</span>
        <span style="width:30px;height:1.5px;background:{{ ink }};opacity:.4;"></span>
        <span style="width:30px;height:32px;border-radius:6px 6px 14px 14px;background:{{ crestBg }};border-top:7px solid {{ crestTop }};box-sizing:border-box;box-shadow:0 0 0 1.5px {{ ink }};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:10px;color:#FFFFFF;">{{ crest }}</span>
        <span style="font-family:'Barlow Condensed';font-weight:800;font-size:8.5px;letter-spacing:.06em;text-align:center;white-space:nowrap;">{{ zona }}</span>
      </div>
      <div style="position:absolute;left:0;right:0;top:222px;text-align:center;font-family:'Big Shoulders Display';font-weight:900;font-style:italic;font-size:34px;line-height:1;letter-spacing:.01em;white-space:nowrap;">{{ nombre }}</div>
      <div style="position:absolute;left:24px;right:24px;top:264px;height:1.5px;background:{{ ink }};opacity:.3;"></div>
      <div style="position:absolute;left:18px;right:18px;top:274px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-family:'Big Shoulders Display';font-weight:900;font-size:30px;line-height:.9;">{{ s.v }}</span><span style="font-family:'Barlow Condensed';font-weight:800;font-size:11px;letter-spacing:.16em;">{{ s.l }}</span></div>
        </sc-for>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;">
        <img src="assets/chilena-logo-claro.png" alt="Chilena" style="width:20px;height:20px;display:block;border-radius:50%;">
        <span style="font-family:'Barlow Condensed';font-weight:800;font-size:10px;letter-spacing:.2em;">{{ nivelLabel }}</span>
      </div>
      <sc-if value="{{ oculto }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:-30px;right:-30px;top:150px;height:34px;transform:rotate(-14deg);background:repeating-linear-gradient(135deg,#D0FF41 0 16px,#07090C 16px 32px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35);">
          <span style="background:#07090C;color:#D0FF41;padding:3px 10px;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.16em;">CARTA EN CONSTRUCCIÓN</span>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ isBack }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:20px;right:20px;top:24px;display:flex;align-items:center;gap:10px;">
        <span style="font-family:'Big Shoulders Display';font-weight:900;font-size:40px;line-height:.8;">{{ media }}</span>
        <div style="flex:1;min-width:0;"><div style="font-family:'Big Shoulders Display';font-weight:900;font-style:italic;font-size:22px;line-height:.9;white-space:nowrap;">{{ nombre }}</div><div style="font-family:'Barlow Condensed';font-weight:800;font-size:10px;letter-spacing:.16em;margin-top:3px;">{{ pos }} · APERTURA 2026</div></div>
        <span style="width:24px;height:26px;border-radius:5px 5px 11px 11px;background:{{ crestBg }};border-top:6px solid {{ crestTop }};box-sizing:border-box;box-shadow:0 0 0 1.5px {{ ink }};flex:none;"></span>
      </div>
      <div style="position:absolute;left:20px;right:20px;top:74px;height:1.5px;background:{{ ink }};opacity:.3;"></div>
      <div style="position:absolute;left:20px;right:20px;top:86px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px;">
        <sc-for list="{{ attrs }}" as="a" hint-placeholder-count="6">
          <div style="display:flex;flex-direction:column;gap:3px;">
            <div style="display:flex;align-items:baseline;gap:6px;"><span style="font-family:'Big Shoulders Display';font-weight:900;font-size:36px;line-height:.85;">{{ a.v }}</span><span style="font-family:'Big Shoulders Display';font-weight:900;font-size:17px;">{{ a.k }}</span></div>
            <span style="font-family:'Barlow Condensed';font-weight:700;font-size:10.5px;letter-spacing:.06em;line-height:1.1;white-space:nowrap;">{{ a.name }}</span>
            <div style="height:4px;border-radius:2px;background:{{ track }};overflow:hidden;"><div style="width:{{ a.pct }};height:100%;background:{{ ink }};border-radius:2px;"></div></div>
          </div>
        </sc-for>
      </div>
      <div style="position:absolute;left:20px;right:20px;bottom:36px;font-size:11px;line-height:1.3;text-align:center;font-weight:600;">{{ nota }}</div>
      <div style="position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;">
        <img src="assets/chilena-logo-claro.png" alt="Chilena" style="width:20px;height:20px;display:block;border-radius:50%;">
        <span style="font-family:'Barlow Condensed';font-weight:800;font-size:10px;letter-spacing:.2em;">{{ nivelLabel }}</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:400},&quot;nivel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bronce&quot;,&quot;plata&quot;,&quot;oro&quot;,&quot;leyenda&quot;,&quot;especial&quot;],&quot;default&quot;:&quot;oro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;frente&quot;,&quot;reverso&quot;],&quot;default&quot;:&quot;frente&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;media&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;87&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DC&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nombre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;EL CHÍCHARO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oculto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;crest&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DP&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crestBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0250B0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crestTop&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFFFF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zona&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;IZTAPALAPA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photoId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;carta-chicharo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stats&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{v:any,l:string}[]&quot;},&quot;attrs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{k:string,name:string,v:number}[]&quot;},&quot;nota&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = {
      bronce: { rim: '#5E3A20', bg: 'linear-gradient(160deg,#E7B386,#B87645 45%,#7A4A28)', ink: '#2A1608', fade: 'rgba(160,100,58,.95)', track: 'rgba(42,22,8,.2)', label: 'BRONCE' },
      plata: { rim: '#7D899A', bg: 'linear-gradient(160deg,#FFFFFF,#C6D0DD 45%,#8E9AAB)', ink: '#0B1626', fade: 'rgba(184,194,208,.95)', track: 'rgba(11,22,38,.18)', label: 'PLATA' },
      oro: { rim: '#8C6A22', bg: 'linear-gradient(160deg,#FFF1C2,#E8C46A 45%,#B8913A)', ink: '#2A1E05', fade: 'rgba(222,184,94,.95)', track: 'rgba(42,30,5,.2)', label: 'ORO' },
      leyenda: { rim: '#D0FF41', bg: 'linear-gradient(160deg,#222B3A,#07090C 62%)', ink: '#F4F7FA', fade: 'rgba(14,18,25,.95)', track: 'rgba(244,247,250,.18)', label: 'LEYENDA DEL BARRIO' },
      especial: { rim: '#D0FF41', bg: 'linear-gradient(160deg,#0A63D6,#0250B0 55%,#023B83)', ink: '#FFFFFF', fade: 'rgba(2,74,163,.95)', track: 'rgba(255,255,255,.22)', label: 'ONCE DE LA JORNADA' }
    };
    const n = this.props.nivel ?? 'oro';
    const p = P[n] || P.oro;
    const lado = this.props.lado ?? 'frente';
    const oculto = !!this.props.oculto;
    const attrs = (this.props.attrs ?? [
      { k: 'DEF', name: 'DEFINICIÓN', v: 91 }, { k: 'PAS', name: 'PASE', v: 74 },
      { k: 'CON', name: 'CONSTANCIA', v: 88 }, { k: 'DIS', name: 'DISCIPLINA', v: 70 },
      { k: 'CRK', name: 'CRACK · VOTOS MVP', v: 86 }, { k: 'RES', name: 'RESPETO · RIVALES', v: 79 }
    ]).map(a => ({ ...a, pct: a.v + '%' }));
    return {
      ...p,
      nivelLabel: p.label,
      isFront: lado === 'frente',
      isBack: lado === 'reverso',
      oculto,
      showMedia: !oculto,
      media: this.props.media ?? '87',
      pos: this.props.pos ?? 'DC',
      nombre: this.props.nombre ?? 'EL CHÍCHARO',
      crest: this.props.crest ?? 'DP',
      crestBg: this.props.crestBg ?? '#0250B0',
      crestTop: this.props.crestTop ?? '#FFFFFF',
      zona: this.props.zona ?? 'IZTAPALAPA',
      photoId: this.props.photoId ?? 'carta-chicharo',
      stats: this.props.stats ?? (this.props.statsStr ? this.props.statsStr.split('|').map(s => { const [v, l] = s.split(':'); return { v, l }; }) : [{ v: 19, l: 'GOL' }, { v: 14, l: 'PJ' }, { v: 7, l: 'AST' }]),
      attrs,
      nota: this.props.nota ?? 'RES lo votan los rivales después de cada partido'
    };
  }
}
</script>
</body>
</html>
